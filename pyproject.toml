[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuro-lang"
version = "0.8.0.dev0"
description = "The Kuro programming language compiler and runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Kuro contributors" },
]
dependencies = []

[project.scripts]
kuro = "cli.kuro:entrypoint"

[tool.setuptools.packages.find]
include = ["compiler*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
