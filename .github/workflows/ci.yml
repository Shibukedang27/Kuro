name: Kuro CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out Kuro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Install Kuro
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q --durations=20

  linux-portability:
    name: Linux portability (x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kuro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Install Kuro
        run: python -m pip install -e .

      - name: Install ARM64 freestanding test tools
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-user lld

      - name: Run portable language and toolchain tests
        run: >-
          python -m pytest -q
          --ignore=tests/compiler/test_native.py
          --ignore=tests/compiler/test_self_host.py
          --ignore=tests/self_host/test_artifact_launcher.py
          --ignore=tests/self_host/test_native_codegen.py

      - name: Verify Linux x86-64 backend
        run: >-
          python -m pytest -q tests/compiler/test_native.py
          -k "linux_backend or x86_64_backend or native_cli"

      - name: Link and run Linux native codegen and VM smoke tests
        run: >-
          python -m pytest -q
          tests/self_host/test_native_codegen.py::test_kuro_owned_x86_linux_codegen_links_and_runs
          tests/self_host/test_native_codegen.py::test_kuro_owned_x86_linux_codegen_runs_decimal_printing
          tests/self_host/test_native_codegen.py::test_kuro_owned_x86_linux_codegen_runs_decimal_storage
          tests/self_host/test_native_codegen.py::test_kuro_owned_generator_records_analyzer_execution_boundary
          tests/self_host/test_artifact_launcher.py::test_native_artifact_launcher_executes_multi_value_reassignment

      - name: Build Linux native production images (hosted bootstrap seed)
        run: make native-hosted-bootstrap PYTHON=python NATIVE_TARGET=x86_64-linux

      - name: Verify production images with Python and toolchains blocked
        run: sh tests/self_host/python_free_native_smoke.sh
