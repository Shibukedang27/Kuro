name: Kuro CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out Kuro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Install Kuro
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

  linux-portability:
    name: Linux portability (x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kuro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Install Kuro
        run: python -m pip install -e .

      - name: Run portable language and toolchain tests
        run: >-
          python -m pytest -q
          --ignore=tests/compiler/test_native.py
          --ignore=tests/compiler/test_self_host.py
          --ignore=tests/self_host/test_artifact_launcher.py
          --ignore=tests/self_host/test_native_codegen.py

      - name: Verify Linux x86-64 backend
        run: >-
          python -m pytest -q tests/compiler/test_native.py
          -k "linux_backend or x86_64_backend or native_cli"
